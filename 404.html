<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PONIS - Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect trick
    // Encodes the full path/query/hash into a ?p= query param and redirects to index.html
    var segmentCount = 1; // number of path segments in base URL (/PONIS-/ = 1)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
